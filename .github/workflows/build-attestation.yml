# ─────────────────────────────────────────────────────────────────────────────
# DevSec Vault — Build & Attestation
# Separated from supply-chain.yml so Scorecard verification passes.
# Scorecard rejects workflows where any non-scorecard job holds id-token: write.
# ─────────────────────────────────────────────────────────────────────────────

name: Build Attestation

on:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  attest:
    name: Build & Attest
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      id-token: write       # OIDC — required for artifact attestation
      attestations: write   # provenance — scoped to this job only
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Package CLI as zip artifact
        run: |
          mkdir -p dist
          zip -r dist/devsec-vault-src.zip src/ requirements.txt README.md
          sha256sum dist/devsec-vault-src.zip | tee dist/devsec-vault-src.zip.sha256

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/devsec-vault-src.zip
        continue-on-error: true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: devsec-vault-build
          path: dist/
