# ─────────────────────────────────────────────────────────────────────────────
# DevSec Vault — Build & Attestation
# All actions pinned to full commit SHA (Scorecard: Pinned-Dependencies)
# ─────────────────────────────────────────────────────────────────────────────

name: Build Attestation

on:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  attest:
    name: Build & Attest
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Package CLI as zip artifact
        run: |
          mkdir -p dist
          zip -r dist/devsec-vault-src.zip src/ requirements.txt README.md
          sha256sum dist/devsec-vault-src.zip | tee dist/devsec-vault-src.zip.sha256

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: dist/devsec-vault-src.zip
        continue-on-error: true

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: devsec-vault-build
          path: dist/
