name: DevSec Vault Security Scan

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

      - name: Run DevSec Vault Scanner
        run: |
          python3 src/cli.py src --format json > report.json

      - name: Fail pipeline if secrets found
        run: |
          if grep -q "AWS Key\|GitHub Token\|Slack Token\|Password" report.json; then
            echo "SECURITY ISSUE DETECTED - PIPELINE FAILED"
            exit 1
          fi

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: scan-report
          path: report.json