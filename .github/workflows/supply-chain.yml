# ─────────────────────────────────────────────────────────────────────────────
# DevSec Vault — Supply-Chain Security
# Build provenance (attestations) + OpenSSF Scorecard
#
# Scorecard hard restriction: only runs on the default branch (main).
# Trigger is therefore main-only + weekly schedule.
# ─────────────────────────────────────────────────────────────────────────────

name: Supply Chain

on:
  push:
    branches: ["main"]        # Scorecard only supports the default branch
  schedule:
    - cron: "0 4 * * 1"       # Weekly Monday 04:00 UTC

permissions:
  contents: read
  id-token: write
  attestations: write
  security-events: write
  actions: read

jobs:
  # ── Build Artifact + Attestation ─────────────────────────────────────────
  attest:
    name: Build & Attest
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Package CLI as zip artifact
        run: |
          mkdir -p dist
          zip -r dist/devsec-vault-src.zip src/ requirements.txt README.md
          sha256sum dist/devsec-vault-src.zip | tee dist/devsec-vault-src.zip.sha256

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/devsec-vault-src.zip
        continue-on-error: true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: devsec-vault-build
          path: dist/

  # ── OpenSSF Scorecard ─────────────────────────────────────────────────────
  scorecard:
    name: OpenSSF Scorecard
    runs-on: ubuntu-latest
    # Extra guard: skip if somehow triggered from a non-default branch
    if: github.ref == 'refs/heads/main'
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run Scorecard analysis
        uses: ossf/scorecard-action@v2.4.0
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true      # Safe: repo is public + running on main
          repo_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Scorecard SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: scorecard.sarif
          category: scorecard
        continue-on-error: true      # Degrades gracefully if Code Scanning off
