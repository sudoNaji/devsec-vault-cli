# ─────────────────────────────────────────────────────────────────────────────
# DevSec Vault — Supply-Chain Security (Scorecard only)
# The attest job lives in build-attestation.yml so Scorecard verification
# passes — it rejects workflows where any non-scorecard job holds id-token: write.
# ─────────────────────────────────────────────────────────────────────────────

name: Supply Chain

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "0 4 * * 1"

# Global permissions: minimal read-only baseline
permissions:
  contents: read
  security-events: read
  actions: read

jobs:
  # ── OpenSSF Scorecard ─────────────────────────────────────────────────────
  scorecard:
    name: OpenSSF Scorecard
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      actions: read
      id-token: write        # OIDC for Scorecard publish
      security-events: write # SARIF upload to Code Scanning
      statuses: write        # Required for Scorecard ListCommits GraphQL call
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run Scorecard analysis
        uses: ossf/scorecard-action@v2.4.0
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true
          # repo_token omitted — action uses the default GITHUB_TOKEN with
          # the permissions declared above, which resolves the GraphQL
          # "Resource not accessible by integration" error

      - name: Upload Scorecard SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: scorecard.sarif
          category: scorecard
        continue-on-error: true
