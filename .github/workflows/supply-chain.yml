# ─────────────────────────────────────────────────────────────────────────────
# DevSec Vault — Supply-Chain Security
# Build provenance (attestations) + OpenSSF Scorecard
# ─────────────────────────────────────────────────────────────────────────────

name: Supply Chain

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: read
  id-token: write         # OIDC — required for attestations
  attestations: write     # artifact attestation
  security-events: write  # Scorecard SARIF upload

jobs:
  # ── Build Artifact + Attestation ─────────────────────────────────────────
  attest:
    name: Build & Attest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Package CLI as zip artifact
        run: |
          mkdir -p dist
          zip -r dist/devsec-vault-src.zip src/ requirements.txt README.md
          sha256sum dist/devsec-vault-src.zip | tee dist/devsec-vault-src.zip.sha256

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: dist/devsec-vault-src.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: devsec-vault-build
          path: dist/

  # ── OpenSSF Scorecard ─────────────────────────────────────────────────────
  scorecard:
    name: OpenSSF Scorecard
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run Scorecard analysis
        uses: ossf/scorecard-action@v2.4.0
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true

      - name: Upload Scorecard SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: scorecard.sarif
          category: scorecard
