# ─────────────────────────────────────────────────────────────────────────────
# DevSec Vault — Supply-Chain Security
# Build provenance (attestations) + OpenSSF Scorecard
# ─────────────────────────────────────────────────────────────────────────────

name: Supply Chain

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "0 4 * * 1"

# Global permissions: read-only (Scorecard enforces least-privilege here)
permissions:
  contents: read
  security-events: read
  actions: read

jobs:
  # ── Build Artifact + Attestation ─────────────────────────────────────────
  attest:
    name: Build & Attest
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      attestations: write   # provenance — scoped to this job only
      # id-token: write removed — only scorecard job should mint OIDC tokens
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Package CLI as zip artifact
        run: |
          mkdir -p dist
          zip -r dist/devsec-vault-src.zip src/ requirements.txt README.md
          sha256sum dist/devsec-vault-src.zip | tee dist/devsec-vault-src.zip.sha256

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/devsec-vault-src.zip
        continue-on-error: true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: devsec-vault-build
          path: dist/

  # ── OpenSSF Scorecard ─────────────────────────────────────────────────────
  scorecard:
    name: OpenSSF Scorecard
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      actions: read
      id-token: write        # OIDC for Scorecard publish — ONLY here
      security-events: write # SARIF upload to Code Scanning
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run Scorecard analysis
        uses: ossf/scorecard-action@v2.4.0
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true
          repo_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Scorecard SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: scorecard.sarif
          category: scorecard
        continue-on-error: true
