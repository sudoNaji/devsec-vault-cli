# ─────────────────────────────────────────────────────────────────────────────
# DevSec Vault — Supply-Chain Security (Scorecard only)
# The attest job has been moved to build-attestation.yml so that Scorecard
# verification passes — it rejects workflows where any non-scorecard job
# holds id-token: write permissions.
# ─────────────────────────────────────────────────────────────────────────────

name: Supply Chain

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "0 4 * * 1"

# Global permissions: read-only (Scorecard enforces least-privilege here)
permissions:
  contents: read
  security-events: read
  actions: read

jobs:
  # ── OpenSSF Scorecard ─────────────────────────────────────────────────────
  scorecard:
    name: OpenSSF Scorecard
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      actions: read
      id-token: write        # OIDC for Scorecard publish — only job in this workflow
      security-events: write # SARIF upload to Code Scanning
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run Scorecard analysis
        uses: ossf/scorecard-action@v2.4.0
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true
          repo_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Scorecard SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: scorecard.sarif
          category: scorecard
        continue-on-error: true
