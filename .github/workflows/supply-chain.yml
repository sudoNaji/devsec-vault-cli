# ─────────────────────────────────────────────────────────────────────────────
# DevSec Vault — Supply-Chain Security
# Build provenance (attestations) + OpenSSF Scorecard
#
# Fixes applied:
#   - Scorecard: publish_results false (requires public repo + OSSF token)
#   - Scorecard: repo_token uses GITHUB_TOKEN explicitly (not SCORECARD_TOKEN)
#   - Scorecard: upload-sarif bumped to v4, wrapped in continue-on-error
#     (Code Scanning may not be enabled on personal repos)
#   - Trigger: runs on push to main AND develop, plus weekly schedule
#   - attest: bumped attest-build-provenance to v2, wrapped continue-on-error
#     (attestation API requires specific org/repo permissions)
# ─────────────────────────────────────────────────────────────────────────────

name: Supply Chain

on:
  push:
    branches: ["main", "develop"]
  schedule:
    - cron: "0 4 * * 1"   # Weekly Monday 04:00 UTC

permissions:
  contents: read
  id-token: write
  attestations: write
  security-events: write
  actions: read

jobs:
  # ── Build Artifact + Attestation ─────────────────────────────────────────
  attest:
    name: Build & Attest
    runs-on: ubuntu-latest
    continue-on-error: true   # Graceful if attestation API not available
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Package CLI as zip artifact
        run: |
          mkdir -p dist
          zip -r dist/devsec-vault-src.zip src/ requirements.txt README.md
          sha256sum dist/devsec-vault-src.zip | tee dist/devsec-vault-src.zip.sha256

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/devsec-vault-src.zip
        continue-on-error: true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: devsec-vault-build
          path: dist/

  # ── OpenSSF Scorecard ─────────────────────────────────────────────────────
  scorecard:
    name: OpenSSF Scorecard
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run Scorecard analysis
        uses: ossf/scorecard-action@v2.4.0
        with:
          results_file: scorecard.sarif
          results_format: sarif
          # publish_results requires the repo to be public AND an OSSF token.
          # Set to false so the job succeeds on any repo type.
          publish_results: false
          repo_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Scorecard SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: scorecard.sarif
          category: scorecard
        # Needs Code Scanning to be enabled; degrade gracefully if not.
        continue-on-error: true
